name: Deploy Modal app

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Modal
        run: python -m pip install --upgrade pip modal httpx

      - name: Provision Telegram secret
        shell: bash
        run: |
          set +x
          python - <<'PY'
          import os
          import subprocess

          token = os.environ.get("TELEGRAM_BOT_TOKEN", "")
          if not token:
              raise SystemExit("GitHub secret TELEGRAM_BOT_TOKEN is missing")
          subprocess.run(
              ["modal", "secret", "create", "vikky-telegram", "TELEGRAM_BOT_TOKEN=" + token],
              check=True,
              stdout=subprocess.DEVNULL,
              stderr=subprocess.STDOUT,
          )
          print("Modal Telegram secret provisioned.")
          PY

      - name: Deploy
        run: modal deploy modal_app.py

      - name: Configure Telegram webhook
        run: |
          python - <<'PY'
          import modal
          import urllib.request

          fn = modal.Function.from_name("vikky-movie-ai", "api")
          url = fn.get_web_url()
          if not url:
              raise SystemExit("Modal API web URL was not available after deployment")
          setup_url = url.rstrip("/") + "/telegram/setup"
          print("Configuring Telegram webhook:", setup_url)
          with urllib.request.urlopen(setup_url, timeout=30) as response:
              body = response.read().decode()
              print(body)
          PY