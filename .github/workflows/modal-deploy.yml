name: Deploy Modal app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      VIKKY_REMOTE_TOKEN: ${{ secrets.VIKKY_REMOTE_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Modal
        run: python -m pip install --upgrade pip modal

      - name: Provision Modal secrets
        shell: bash
        run: |
          set +x
          test -n "$TELEGRAM_BOT_TOKEN" || { echo "Missing GitHub secret TELEGRAM_BOT_TOKEN"; exit 1; }
          test -n "$VIKKY_REMOTE_TOKEN" || { echo "Missing remote token"; exit 1; }
          modal secret create --force vikky-telegram "TELEGRAM_BOT_TOKEN=$TELEGRAM_BOT_TOKEN"
          modal secret create --force vikky-remote "VIKKY_REMOTE_TOKEN=$VIKKY_REMOTE_TOKEN"

      - name: Deploy
        run: modal deploy modal_app.py

      - name: Configure Telegram webhook
        shell: bash
        run: |
          python - <<'PY'
          import modal
          import urllib.request

          fn = modal.Function.from_name("vikky-movie-ai", "api")
          url = fn.get_web_url()
          if not url:
              raise SystemExit("Modal API web URL was not available after deployment")
          setup_url = url.rstrip("/") + "/setup"
          print("Configuring Telegram webhook")
          with urllib.request.urlopen(setup_url, timeout=60) as response:
              body = response.read().decode()
              print(body)
          PY

      - name: Verify deployed health
        shell: bash
        run: |
          python - <<'PY'
          import modal
          import urllib.request
          import json

          fn = modal.Function.from_name("vikky-movie-ai", "api")
          url = fn.get_web_url()
          if not url:
              raise SystemExit("No Modal web URL")
          with urllib.request.urlopen(url.rstrip("/") + "/health", timeout=30) as response:
              data = json.loads(response.read().decode())
          if data.get("status") != "ok" or not data.get("telegram_configured"):
              raise SystemExit(f"Health check failed: {data}")
          print("Modal health:", data)
          PY
