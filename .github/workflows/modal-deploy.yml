name: Deploy Modal app

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Modal
        run: python -m pip install --upgrade pip modal

      - name: Deploy
        run: modal deploy modal_app.py

      - name: Configure Telegram webhook
        run: |
          python - <<'PY'
          import modal
          import urllib.request

          fn = modal.Function.from_name("vikky-movie-ai", "api")
          url = fn.get_web_url()
          if not url:
              raise SystemExit("Modal API web URL was not available after deployment")
          setup_url = url.rstrip("/") + "/telegram/setup"
          print("Configuring Telegram webhook:", setup_url)
          with urllib.request.urlopen(setup_url, timeout=30) as response:
              body = response.read().decode()
              print(body)
          PY
