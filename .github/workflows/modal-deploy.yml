name: Deploy Modal App

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "modal>=1.5,<2" httpx fastapi
      - name: Validate secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$MODAL_TOKEN_ID" || { echo "Missing MODAL_TOKEN_ID"; exit 1; }
          test -n "$MODAL_TOKEN_SECRET" || { echo "Missing MODAL_TOKEN_SECRET"; exit 1; }
          test -n "$TELEGRAM_BOT_TOKEN" || { echo "Missing TELEGRAM_BOT_TOKEN"; exit 1; }
      - name: Provision Modal Telegram secret
        run: modal secret create --force vikky-telegram "TELEGRAM_BOT_TOKEN=$TELEGRAM_BOT_TOKEN"
      - name: Deploy to Modal
        run: modal deploy modal_app.py
      - name: Get Modal URL and verify health
        shell: bash
        run: |
          set -euo pipefail
          APP_URL="$(python - <<'PY'
          import modal
          fn = modal.Function.from_name("vikky-movie-ai-bot", "api")
          url = fn.get_web_url()
          if not url:
              raise SystemExit("Modal API URL unavailable")
          print(url.rstrip("/"))
          PY
          )"
          echo "APP_URL=$APP_URL" >> "$GITHUB_ENV"
          echo "Modal URL: $APP_URL"
          curl -fsS "$APP_URL/health"
      - name: Configure Telegram webhook and commands
        shell: bash
        run: |
          set -euo pipefail
          WEBHOOK_URL="${APP_URL}/webhook"
          curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/setWebhook"             -H "Content-Type: application/json"             -d "{\"url\": \"${WEBHOOK_URL}\", \"drop_pending_updates\": false}"
          curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/setMyCommands"             -H "Content-Type: application/json"             -d '{"commands":[{"command":"help","description":"Bot ela vadalo Telugu/Tenglish help"}]}'
          echo
          echo "Webhook info:"
          curl -fsS "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getWebhookInfo"
