name: Vikky Cinema-Grade Pure 4K AI Upscaler
on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Enter ANY Video URL (Direct link, GDrive, Stream, etc.)'
        required: true
        type: string
  repository_dispatch:
    types: [start_upscale]
permissions:
  contents: read
jobs:
  cinema_4k_upscale:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      VIDEO_URL: ${{ inputs.video_url || github.event.client_payload.url }}
    steps:
      - name: Free Runner Space
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo apt-get clean
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install CPU PyTorch and Tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends aria2 ffmpeg jq curl wget git
          python -m pip install --upgrade pip setuptools wheel
          pip install --no-cache-dir torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install --no-cache-dir basicsr facexlib gfpgan opencv-python-headless Pillow tqdm pyyaml scipy yt-dlp
      - name: Install Official Real-ESRGAN and Model
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/xinntao/Real-ESRGAN.git Real-ESRGAN
          pip install --no-cache-dir -e ./Real-ESRGAN --no-deps
          mkdir -p weights
          wget -q --show-progress -O weights/RealESRGAN_x4plus.pth https://github.com/xinntao/Real-ESRGAN/releases/download/v0.1.0/RealESRGAN_x4plus.pth
          test -s weights/RealESRGAN_x4plus.pth
      - name: Download Source Video
        run: |
          set -euo pipefail
          test -n "$VIDEO_URL"
          yt-dlp --no-part --external-downloader aria2c --external-downloader-args "-x 16 -s 16 -k 1M" "$VIDEO_URL" -o input.mp4 || true
          [ -s input.mp4 ] || aria2c -x 16 -s 16 -k 1M --allow-overwrite=true "$VIDEO_URL" -o input.mp4 || true
          [ -s input.mp4 ] || curl -fL --retry 5 --retry-delay 3 --continue-at - "$VIDEO_URL" -o input.mp4
          test -s input.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height,avg_frame_rate -of default=nw=1 input.mp4
      - name: Preserve Original Audio Bitstream
        run: |
          set -euo pipefail
          if ffprobe -v error -select_streams a:0 -show_entries stream=index -of csv=p=0 input.mp4 | grep -q .; then
            ffmpeg -hide_banner -loglevel error -y -i input.mp4 -map 0:a? -c copy original_audio.mka
          fi
      - name: Build CPU Real-ESRGAN Streamer
        run: |
          set -euo pipefail
          cat > stream_upscale.py <<'PY'
          import argparse,os,shutil,subprocess,tempfile
          import cv2,torch
          from basicsr.archs.rrdbnet_arch import RRDBNet
          from realesrgan import RealESRGANer
          p=argparse.ArgumentParser()
          p.add_argument("--input",required=True);p.add_argument("--output",required=True);p.add_argument("--fps",required=True);p.add_argument("--weights",required=True)
          a=p.parse_args();torch.set_num_threads(max(1,min(4,os.cpu_count() or 1)));torch.set_num_interop_threads(1)
          cap=cv2.VideoCapture(a.input)
          if not cap.isOpened(): raise RuntimeError("Cannot open chunk")
          w=int(cap.get(cv2.CAP_PROP_FRAME_WIDTH));h=int(cap.get(cv2.CAP_PROP_FRAME_HEIGHT))
          model=RRDBNet(num_in_ch=3,num_out_ch=3,num_feat=64,num_block=23,num_grow_ch=32,scale=4)
          up=RealESRGANer(scale=4,model_path=a.weights,model=model,tile=256,tile_pad=10,pre_pad=0,half=False,gpu_id=None)
          td=tempfile.mkdtemp(prefix="vikky_frame_");png=os.path.join(td,"frame.png")
          enc=subprocess.Popen(["ffmpeg","-hide_banner","-loglevel","warning","-y","-f","rawvideo","-pix_fmt","bgr24","-s:v",f"{w*4}x{h*4}","-r",a.fps,"-i","-","-an","-c:v","libx265","-crf","16","-preset","fast","-pix_fmt","yuv420p",a.output],stdin=subprocess.PIPE)
          n=0
          try:
            while True:
              ok,frame=cap.read()
              if not ok:break
              if not cv2.imwrite(png,frame,[cv2.IMWRITE_PNG_COMPRESSION,1]):raise RuntimeError("PNG write failed")
              raw=cv2.imread(png,cv2.IMREAD_COLOR);out,_=up.enhance(raw,outscale=4)
              try:os.remove(png)
              except FileNotFoundError:pass
              enc.stdin.write(out.tobytes());n+=1
              if n%25==0:print(f"AI frames processed: {n}",flush=True)
            cap.release();enc.stdin.close();rc=enc.wait()
            if rc:raise RuntimeError(f"libx265 failed: {rc}")
          except Exception:
            cap.release()
            try:enc.stdin.close()
            except Exception:pass
            enc.kill();enc.wait();raise
          finally:shutil.rmtree(td,ignore_errors=True)
          if n==0:raise RuntimeError("No frames processed")
          PY
      - name: Keyframe Chunks and AI Inference
        run: |
          set -euo pipefail
          mkdir -p chunks parts
          FPS=$(ffprobe -v error -select_streams v:0 -show_entries stream=avg_frame_rate -of csv=p=0 input.mp4)
          [ -n "$FPS" ] || FPS=$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 input.mp4)
          ffmpeg -hide_banner -loglevel warning -y -i input.mp4 -map 0:v:0 -an -c:v copy -f segment -segment_time 600 -reset_timestamps 1 chunks/chunk_%04d.mp4
          rm -f input.mp4
          for chunk in chunks/chunk_*.mp4;do
            [ -e "$chunk" ]||continue
            name=$(basename "$chunk" .mp4)
            python3 stream_upscale.py --input "$chunk" --output "parts/${name}.mp4" --fps "$FPS" --weights "weights/RealESRGAN_x4plus.pth"
            rm -f "$chunk";df -h .
          done
          rm -rf chunks stream_upscale.py
          find parts -type f -name '*.mp4' -print|sort|sed "s#^#file '#;s#$#'#" > list.txt
          test -s list.txt
          ffmpeg -hide_banner -loglevel warning -y -f concat -safe 0 -i list.txt -c copy -movflags +faststart master_ai.mp4
          rm -rf parts list.txt
      - name: Outro and Untouched Audio Mux
        run: |
          set -euo pipefail
          W=$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 master_ai.mp4)
          H=$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 master_ai.mp4)
          FPS=$(ffprobe -v error -select_streams v:0 -show_entries stream=avg_frame_rate -of csv=p=0 master_ai.mp4)
          ffmpeg -hide_banner -loglevel warning -y -f lavfi -i "color=c=black:s=${W}x${H}:d=3:r=${FPS}" -vf "drawtext=text='AI Upscale 4K by Vikky':fontcolor=white:fontsize=80:x=(w-text_w)/2:y=(h-text_h)/2" -c:v libx265 -crf 16 -preset fast -pix_fmt yuv420p outro.mp4
          printf "file 'master_ai.mp4'\nfile 'outro.mp4'\n" > merge.txt
          ffmpeg -hide_banner -loglevel warning -y -f concat -safe 0 -i merge.txt -c copy combined.mp4
          if [ -s original_audio.mka ];then
            if ffmpeg -hide_banner -loglevel warning -y -i combined.mp4 -i original_audio.mka -map 0:v:0 -map 1:a? -c:v copy -c:a copy -movflags +faststart final_cinema_4k.mp4;then FINAL_FILE=final_cinema_4k.mp4
            else
              ffmpeg -hide_banner -loglevel warning -y -i combined.mp4 -i original_audio.mka -map 0:v:0 -map 1:a? -c:v copy -c:a copy final_cinema_4k.mkv
              FINAL_FILE=final_cinema_4k.mkv
            fi
          else cp combined.mp4 final_cinema_4k.mp4;FINAL_FILE=final_cinema_4k.mp4;fi
          echo "FINAL_FILE=$FINAL_FILE" >> "$GITHUB_ENV"
          ffprobe -v error -show_entries stream=index,codec_type,codec_name -of compact=p=0 "$FINAL_FILE"
          rm -f master_ai.mp4 outro.mp4 combined.mp4 original_audio.mka merge.txt
      - name: Dual Upload
        run: |
          set -euo pipefail
          test -s "$FINAL_FILE"
          GO_RES=$(curl -fL --retry 5 --retry-delay 5 -F "file=@$FINAL_FILE" https://upload.gofile.io/uploadfile)
          GOFILE_LINK=$(echo "$GO_RES"|jq -r '.data.downloadPage // empty');test -n "$GOFILE_LINK"
          BUZZ_LINK=$(curl -fL --retry 5 --retry-delay 5 -T "$FINAL_FILE" "https://w.buzzheavier.com/$FINAL_FILE"|tr -d '\r\n');test -n "$BUZZ_LINK"
          echo "🎬 CINEMA-GRADE PURE REAL-ESRGAN COMPLETE"
          echo "🧠 Official RealESRGAN_x4plus / PyTorch CPU / FP32"
          echo "🎞️ H.265 libx265 CRF 16"
          echo "🔊 Original audio copied without re-encoding"
          echo "🔗 GOFILE: $GOFILE_LINK"
          echo "🔗 BUZZHEAVIER: $BUZZ_LINK"
