name: Vikky 4K AI Upscaler to Gofile

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Direct Video URL'
        required: true
        default: 'https://f2l2.reaperzclub.dpdns.org/xp1gdlr?hash=AgADhC&dl=1'
        type: string

jobs:
  upscale_and_upload:
    runs-on: ubuntu-latest
    steps:
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2 ffmpeg jq python3-pip curl

      - name: Download Input Video
        run: |
          aria2c -x 16 -s 16 -k 1M "${{ inputs.video_url }}" -o "input.mp4"

      - name: Extract Lossless Audio
        run: |
          ffmpeg -i input.mp4 -vn -c:a copy pure_audio.aac || touch pure_audio.aac

      - name: 4K AI Upscaling (Lanczos + Unsharp Masking)
        run: |
          # 3-Second Outro Title Card
          ffmpeg -f lavfi -i color=c=black:s=3840x2160:d=3 -vf "drawtext=text='AI Upscale 4K by Vikky':fontcolor=white:fontsize=80:x=(w-text_w)/2:y=(h-text_h)/2" -c:v libx264 -pix_fmt yuv420p outro.mp4

          # High-Precision 4K Upscale & Sharpening
          ffmpeg -i input.mp4 -vf "scale=3840:2160:flags=lanczos,unsharp=5:5:1.0:5:5:0.0" -c:v libx264 -profile:v high -level 5.1 -crf 17 -preset slow -pix_fmt yuv420p upscaled_video.mp4

          # Merge Outro
          printf "file 'upscaled_video.mp4'\nfile 'outro.mp4'\n" > merge_list.txt
          ffmpeg -f concat -safe 0 -i merge_list.txt -c copy merged_raw.mp4

          # Combine with Pure Audio
          if [ -s pure_audio.aac ]; then
            ffmpeg -i merged_raw.mp4 -i pure_audio.aac -c:v copy -c:a copy -map 0:v:0 -map 1:a:0? -movflags +faststart final_output_4k.mp4
          else
            ffmpeg -i merged_raw.mp4 -c:v copy -movflags +faststart final_output_4k.mp4
          fi

      - name: Upload Output to Gofile
        run: |
          SERVER=$(curl -s https://api.gofile.io/servers | jq -r '.data.servers[0].name')
          UPLOAD_RES=$(curl -F "file=@final_output_4k.mp4" "https://${SERVER}.gofile.io/contents/uploadfile")
          DOWNLOAD_PAGE=$(echo $UPLOAD_RES | jq -r '.data.downloadPage')

          echo "======================================================="
          echo "4K UPSCALE COMPLETE!"
          echo "GOFILE DOWNLOAD LINK: $DOWNLOAD_PAGE"
          echo "======================================================="