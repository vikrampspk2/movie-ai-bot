name: Vikky Cinema-Grade Pure 4K AI Upscaler
on:
  workflow_dispatch:
    inputs:
      video_url:
        required: true
        type: string
  repository_dispatch:
    types: [start_upscale]
permissions:
  contents: write
concurrency:
  group: vikky-cinema-upscale-global
  cancel-in-progress: false
jobs:
  upscale:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      VIDEO_URL: ${{ inputs.video_url || github.event.client_payload.url }}
      SAFE: "19800"
      RESERVE: "1200"
      CHUNK_SEC: "600"
    steps:
      - name: Setup
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg aria2 curl wget git gh jq fonts-dejavu
          python3 -m pip install --upgrade pip
          python3 -m pip install --no-cache-dir yt-dlp bhdownloader numpy
          echo "START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Download and content identity
        run: |
          set -euo pipefail
          yt-dlp --no-part --external-downloader aria2c --external-downloader-args "-x 16 -s 16 -k 1M" "$VIDEO_URL" -o input.mp4 || true
          [ -s input.mp4 ] || aria2c -x 16 -s 16 -k 1M "$VIDEO_URL" -o input.mp4 || true
          [ -s input.mp4 ] || curl -fL --retry 5 "$VIDEO_URL" -o input.mp4
          test -s input.mp4
          SHA=$(sha256sum input.mp4 | awk '{print $1}')
          FRAMES=$(ffprobe -v error -count_frames -select_streams v:0 -show_entries stream=nb_read_frames -of csv=p=0 input.mp4 | tail -1)
          FPS=$(ffprobe -v error -select_streams v:0 -show_entries stream=avg_frame_rate -of csv=p=0 input.mp4)
          [ -n "$FPS" ] && [ "$FPS" != "0/0" ] || FPS=$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 input.mp4)
          W=$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 input.mp4)
          H=$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 input.mp4)
          ID="$SHA-$FRAMES"; STATE=".video_state/$ID.json"
          printf 'SHA=%s\nFRAMES=%s\nFPS=%s\nW=%s\nH=%s\nID=%s\nSTATE=%s\n' "$SHA" "$FRAMES" "$FPS" "$W" "$H" "$ID" "$STATE" >> "$GITHUB_ENV"
          mkdir -p state
          if ! gh api "repos/$GITHUB_REPOSITORY/contents/$STATE?ref=main" --jq .content 2>/dev/null | tr -d '\n' | base64 -d > state/s.json; then
            jq -n --arg id "$ID" --arg sha "$SHA" --arg fps "$FPS" --argjson f "$FRAMES" --argjson w "$W" --argjson h "$H" \
              '{video_id:$id,sha256:$sha,frame_count:$f,fps:$fps,width:$w,height:$h,status:"new",chunks:{},final_links:{}}' > state/s.json
          fi
          if [ "$(jq -r .status state/s.json)" = complete ] && [ "$(jq -r .sha256 state/s.json)" = "$SHA" ]; then
            GO=$(jq -r .final_links.gofile state/s.json); BZ=$(jq -r .final_links.buzzheavier state/s.json)
            if curl -fsIL --max-time 20 "$GO" >/dev/null 2>&1 && curl -fsIL --max-time 20 "$BZ" >/dev/null 2>&1; then
              echo "DONE=true" >> "$GITHUB_ENV"; echo "VIDEO ID: $ID"; echo "GOFILE: $GO"; echo "BUZZHEAVIER: $BZ"
            else echo "DONE=false" >> "$GITHUB_ENV"; fi
          else echo "DONE=false" >> "$GITHUB_ENV"; fi

      - name: Install official Real-ESRGAN CPU FP32
        if: ${{ env.DONE != 'true' }}
        run: |
          set -euo pipefail
          python3 -m pip install --no-cache-dir torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python3 -m pip install --no-cache-dir basicsr facexlib gfpgan opencv-python-headless Pillow scipy
          git clone --depth 1 https://github.com/xinntao/Real-ESRGAN.git Real-ESRGAN
          python3 -m pip install --no-cache-dir -e ./Real-ESRGAN --no-deps
          mkdir -p weights
          wget -q -O weights/RealESRGAN_x4plus.pth https://github.com/xinntao/Real-ESRGAN/releases/download/v0.1.0/RealESRGAN_x4plus.pth

      - name: Preserve original audio
        if: ${{ env.DONE != 'true' }}
        run: |
          if ffprobe -v error -select_streams a:0 -show_entries stream=index -of csv=p=0 input.mp4 | grep -q .; then
            ffmpeg -hide_banner -loglevel error -y -i input.mp4 -map 0:a? -c:a copy audio.mka
          else : > audio.mka; fi

      - name: Stream Real-ESRGAN without frame accumulation
        if: ${{ env.DONE != 'true' }}
        run: |
          cat > ai.py <<'PY'
          import sys,os,argparse,subprocess,numpy as np,torch
          from basicsr.archs.rrdbnet_arch import RRDBNet
          from realesrgan import RealESRGANer
          p=argparse.ArgumentParser();p.add_argument("--w",type=int);p.add_argument("--h",type=int);p.add_argument("--fps");p.add_argument("--n",type=int);p.add_argument("--out");a=p.parse_args()
          torch.set_num_threads(max(1,min(4,os.cpu_count() or 1)));torch.set_num_interop_threads(1)
          m=RRDBNet(num_in_ch=3,num_out_ch=3,num_feat=64,num_block=23,num_grow_ch=32,scale=4)
          u=RealESRGANer(scale=4,model_path="weights/RealESRGAN_x4plus.pth",model=m,tile=256,tile_pad=10,pre_pad=0,half=False,gpu_id=None)
          e=subprocess.Popen(["ffmpeg","-hide_banner","-loglevel","warning","-y","-f","rawvideo","-pix_fmt","bgr24","-s:v",f"{a.w*4}x{a.h*4}","-r",a.fps,"-i","-","-an","-c:v","libx265","-crf","16","-preset","fast","-pix_fmt","yuv420p","-f","mpegts",a.out],stdin=subprocess.PIPE)
          z=a.w*a.h*3
          try:
            for _ in range(a.n):
              b=sys.stdin.buffer.read(z)
              if len(b)!=z: raise RuntimeError("frame stream ended")
              f=np.frombuffer(b,dtype=np.uint8).reshape(a.h,a.w,3);o,_=u.enhance(f,outscale=4);e.stdin.write(o.tobytes())
            e.stdin.close()
            if e.wait()!=0: raise RuntimeError("x265 failed")
          except:
            try:e.kill()
            except:pass
            e.wait();raise
          PY

      - name: Hash-resume missing chunks and checkpoint
        if: ${{ env.DONE != 'true' }}
        run: |
          set -euo pipefail
          mkdir -p work chunks
          DEAD=$((START + SAFE))
          python3 - <<'PY' > work/p
          import os
          from fractions import Fraction
          total=int(os.environ["FRAMES"]);fps=Fraction(os.environ["FPS"]);per=int(int(os.environ["CHUNK_SEC"])*fps)
          s=i=0
          while s<total:
            e=min(total,(i+1)*per);print(i,s,e-s,float(Fraction(s,1)/fps));s=e;i+=1
          PY
          TOTAL=$(wc -l < work/p); echo "TOTAL=$TOTAL" >> "$GITHUB_ENV"
          save(){ b=$(base64 -w0 state/s.json); old=$(gh api "repos/$GITHUB_REPOSITORY/contents/$STATE?ref=main" --jq .sha 2>/dev/null||true); if [ -n "$old" ];then gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$STATE" -f message="video-state $ID" -f content="$b" -f branch=main -f sha="$old" >/dev/null;else gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$STATE" -f message="video-state $ID" -f content="$b" -f branch=main >/dev/null;fi; }
          jq '.status="partial"' state/s.json > state/t;mv state/t state/s.json;save
          while read -r I S N SEC;do
            if jq -e --arg i "$I" '.chunks[$i].buzz // empty' state/s.json >/dev/null 2>&1;then echo "SKIP $I";continue;fi
            LEFT=$((DEAD-$(date +%s)-RESERVE));[ "$LEFT" -ge 120 ]||break
            rm -f chunks/c.ts
            set +e
            timeout --signal=TERM --kill-after=60s "$LEFT" bash -c 'ffmpeg -hide_banner -loglevel error -ss "'"$SEC"'" -i input.mp4 -frames:v "'"$N"'" -f rawvideo -pix_fmt bgr24 -r "'"$FPS"'" - | python3 ai.py --w "'"$W"'" --h "'"$H"'" --fps "'"$FPS"'" --n "'"$N"'" --out chunks/c.ts'
            R=$?;set -e
            [ "$R" -eq 0 ]&&[ -s chunks/c.ts ]||{ rm -f chunks/c.ts;break; }
            SUM=$(sha256sum chunks/c.ts|awk '{print $1}');NAME="vikky_$ID_chunk_$(printf '%04d' "$I").ts"
            J=$(curl -fL --retry 5 -T chunks/c.ts "https://w.buzzheavier.com/$NAME");BID=$(echo "$J"|jq -r '.data.id//empty');test -n "$BID"
            jq --arg i "$I" --arg u "https://buzzheavier.com/$BID" --arg s "$SUM" --argjson n "$N" '.chunks[$i]={buzz:$u,sha256:$s,frames:$n}' state/s.json > state/t;mv state/t state/s.json;save
            rm -f chunks/c.ts
          done < work/p
          rm -f input.mp4

      - name: Merge, outro, untouched audio and dual upload
        if: ${{ env.DONE != 'true' }}
        run: |
          set -euo pipefail
          DONE_N=$(jq '.chunks|length' state/s.json);TOTAL_N=$TOTAL
          [ "$DONE_N" -gt 0 ]||exit 0
          mkdir -p merge;:>merge/l
          for I in $(jq -r '.chunks|keys[]' state/s.json|sort -n);do
            P=$(jq -r --arg i "$I" '.chunks[$i].buzz' state/s.json)
            D=$(python3 - "$P" <<'PY'
          import sys
          from bhdownloader import get_download_link
          r=get_download_link(sys.argv[1]);print(r[0] if isinstance(r,tuple) else getattr(r,"download_url",r))
          PY
            )
            printf "file '%s'\n" "$D" >> merge/l
          done
          ffmpeg -hide_banner -loglevel warning -y -protocol_whitelist file,http,https,tcp,tls,crypto -f concat -safe 0 -i merge/l -c copy merge/ai.ts
          SIZE="$W"x"$H"
          ffmpeg -hide_banner -loglevel warning -y -f lavfi -i "color=c=black:s=$SIZE:d=3:r=$FPS" -vf "drawtext=text='AI Upscale 4K by Vikky':fontcolor=white:fontsize=80:x=(w-text_w)/2:y=(h-text_h)/2" -c:v libx265 -crf 16 -preset fast -pix_fmt yuv420p -f mpegts merge/o.ts
          printf "file 'ai.ts'\nfile 'o.ts'\n" > merge/v
          ffmpeg -hide_banner -loglevel warning -y -f concat -safe 0 -i merge/v -c copy merge/video.ts
          FINAL="vikky_$ID.mkv"
          if [ -s audio.mka ];then ffmpeg -hide_banner -loglevel warning -y -i merge/video.ts -i audio.mka -map 0:v:0 -map 1:a? -c:v copy -c:a copy "$FINAL";else cp merge/video.ts "$FINAL";fi
          GO=$(curl -fL --retry 5 -F "file=@$FINAL" https://upload.gofile.io/uploadfile|jq -r '.data.downloadPage//empty')
          J=$(curl -fL --retry 5 -T "$FINAL" "https://w.buzzheavier.com/$FINAL");BID=$(echo "$J"|jq -r '.data.id//empty');test -n "$GO" -a -n "$BID";BZ="https://buzzheavier.com/$BID"
          [ "$DONE_N" -eq "$TOTAL_N" ]&&ST=complete||ST=partial
          save(){ b=$(base64 -w0 state/s.json); old=$(gh api "repos/$GITHUB_REPOSITORY/contents/$STATE?ref=main" --jq .sha 2>/dev/null||true); if [ -n "$old" ];then gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$STATE" -f message="video-state $ID $ST" -f content="$b" -f branch=main -f sha="$old" >/dev/null;else gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$STATE" -f message="video-state $ID $ST" -f content="$b" -f branch=main >/dev/null;fi; }
          jq --arg st "$ST" --arg go "$GO" --arg bz "$BZ" --argjson d "$DONE_N" --argjson t "$TOTAL_N" '.status=$st|.final_links={gofile:$go,buzzheavier:$bz}|.completed_chunks=$d|.total_chunks=$t' state/s.json > state/t;mv state/t state/s.json;save
          echo "VIDEO ID: $ID";echo "SHA-256: $SHA";echo "FRAMES: $FRAMES";echo "CHUNKS: $DONE_N/$TOTAL_N";echo "STATUS: $ST";echo "GOFILE: $GO";echo "BUZZHEAVIER: $BZ"
