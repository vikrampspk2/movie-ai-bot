name: Vikky 4K AI Upscale Worker

on:
  repository_dispatch:
    types: [start_upscale]

jobs:
  upscale_job:
    runs-on: ubuntu-latest
    steps:
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2 ffmpeg jq python3-pip
          pip install yt-dlp

      - name: High-Speed Video Download
        run: |
          yt-dlp --external-downloader aria2c --external-downloader-args "-x 16 -s 16 -k 1M" "${{ github.event.client_payload.url }}" -o "input.mp4"

      - name: Extract Lossless Audio
        run: |
          ffmpeg -i input.mp4 -vn -c:a copy pure_audio.aac

      - name: Start 2-Minute Heartbeat Loop (Auto-Delete in 30s)
        run: |
          cat << 'EOF' > heartbeat.sh
          #!/bin/bash
          BOT_TOKEN="${{ secrets.TG_BOT_TOKEN }}"
          CHAT_ID="${{ github.event.client_payload.chat_id }}"

          while [ ! -f /tmp/upscale_done ]; do
            # Send message
            RESP=$(curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage"               -d chat_id="${CHAT_ID}"               -d text="⏳ Bro bhayapadakandi, video 4K processing live lo active ga undi...")
            
            MSG_ID=$(echo $RESP | jq -r '.result.message_id')
            
            # Wait 30 seconds, then delete
            sleep 30
            if [ "$MSG_ID" != "null" ] && [ -n "$MSG_ID" ]; then
              curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/deleteMessage"                 -d chat_id="${CHAT_ID}"                 -d message_id="${MSG_ID}" > /dev/null
            fi
            
            # Remaining wait for 2-minute cycle (120 - 30 = 90s)
            sleep 90
          done
          EOF
          chmod +x heartbeat.sh
          ./heartbeat.sh &

      - name: AI Upscale & Outro Generation
        run: |
          # 3-sec Outro Title card
          ffmpeg -f lavfi -i color=c=black:s=3840x2160:d=3 -vf "drawtext=text='AI Upscale 4K by Vikky':fontcolor=white:fontsize=75:x=(w-text_w)/2:y=(h-text_h)/2" -c:v libx264 -pix_fmt yuv420p outro.mp4

          DURATION=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 input.mp4 | cut -d'.' -f1)

          if [ "$DURATION" -le 1200 ]; then
            ffmpeg -i input.mp4 -vf "unsharp=5:5:1.0:5:5:0.0,scale=3840:2160:flags=lanczos" -c:v libx264 -profile:v high -level 5.1 -pix_fmt yuv420p -crf 18 -preset fast main_upscaled.mp4
          else
            ffmpeg -i input.mp4 -c copy -map 0 -segment_time 00:05:00 -f segment -reset_timestamps 1 part_%03d.mp4
            rm input.mp4

            for p in part_*.mp4; do
              ffmpeg -i "$p" -vf "unsharp=5:5:1.0:5:5:0.0,scale=3840:2160:flags=lanczos" -c:v libx264 -profile:v high -level 5.1 -pix_fmt yuv420p -crf 18 -preset fast "done_$p"
              rm "$p"
            done

            printf "file '%s'\n" done_part_*.mp4 > parts_list.txt
            ffmpeg -f concat -safe 0 -i parts_list.txt -c copy main_upscaled.mp4
            rm done_part_*.mp4
          fi

          # Attach Outro & Lossless Audio
          printf "file 'main_upscaled.mp4'\nfile 'outro.mp4'\n" > merge_list.txt
          ffmpeg -f concat -safe 0 -i merge_list.txt -c copy final_raw.mp4
          ffmpeg -i final_raw.mp4 -i pure_audio.aac -c:v copy -c:a copy -map 0:v:0 -map 1:a:0? -movflags +faststart final_output_4k.mp4

          # Stop the heartbeat loop
          touch /tmp/upscale_done

      - name: Guest Upload & Telegram Delivery
        run: |
          RESP=$(curl -s -T final_output_4k.mp4 https://pixeldrain.com/api/file/)
          FILE_ID=$(echo $RESP | jq -r '.id')
          DOWNLOAD_URL="https://pixeldrain.com/u/$FILE_ID"

          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TG_BOT_TOKEN }}/sendMessage"             -d chat_id="${{ github.event.client_payload.chat_id }}"             -d text="🎉 Video 4K Upscale aipoyindi bro!%0AQuality: Theatre 4K Lossless%0AOutro: AI Upscale 4K by Vikky%0ADownload Link: $DOWNLOAD_URL"
